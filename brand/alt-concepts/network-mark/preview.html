<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font-family:Arial,sans-serif;margin:0;padding:24px;background:#f2f2f2;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.swatch{padding:24px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:12px}
.white{background:#fff;border:1px solid #ddd}
.dark{background:#0a1420}
.brand{background:#0F5FAE}
.light{background:#EAF3FC}
img.icon{width:64px;height:64px}
img.icon.small{width:32px;height:32px}
img.icon.tiny{width:16px;height:16px}
img.h{height:60px}
label{font-size:11px;color:#888;font-family:monospace}
</style></head>
<body>
<div class="row">
  <div class="swatch white"><img class="icon" src="vi-connect-icon.svg"><label>icon @64 / white</label></div>
  <div class="swatch white"><img class="icon small" src="vi-connect-icon.svg"><label>icon @32</label></div>
  <div class="swatch white"><img class="icon tiny" src="vi-connect-icon.svg"><label>icon @16 (favicon test)</label></div>
  <div class="swatch dark"><img class="icon" src="vi-connect-icon-reverse.svg"><label style="color:#8ab">icon-reverse / dark</label></div>
  <div class="swatch light"><img class="icon" src="vi-connect-icon.svg"><label>icon / light tint</label></div>
</div>
<div class="row">
  <div class="swatch white"><img class="h" src="vi-connect-logo-horizontal.svg"><label>horizontal / white</label></div>
</div>
<div class="row">
  <div class="swatch dark"><img class="h" src="vi-connect-logo-horizontal-reverse.svg"><label style="color:#8ab">horizontal-reverse / dark</label></div>
  <div class="swatch brand"><img class="h" src="vi-connect-logo-horizontal-reverse.svg"><label style="color:#dceeff">horizontal-reverse / brand blue</label></div>
</div>
<div class="row">
  <div class="swatch white"><img class="h" src="vi-connect-logo-horizontal-mono-dark.svg"><label>horizontal-mono-dark / white (single-color print)</label></div>
</div>
<div class="row">
  <div class="swatch white"><img style="width:200px" src="vi-connect-logo-stacked.svg"><label>stacked / white</label></div>
  <div class="swatch brand"><img style="width:64px" src="vi-connect-icon-reverse.svg"><label style="color:#dceeff">icon-reverse / brand blue bg</label></div>
</div>
</body></html>
