<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="viLineGradL" x1="20" y1="20" x2="50" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F5FAE"/>
      <stop offset="1" stop-color="#17A673"/>
    </linearGradient>
    <linearGradient id="viLineGradR" x1="80" y1="20" x2="50" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F5FAE"/>
      <stop offset="1" stop-color="#17A673"/>
    </linearGradient>
  </defs>

  <!-- connection lines: three nodes converging to one match point, forming a V -->
  <line x1="20" y1="20" x2="50" y2="80" stroke="url(#viLineGradL)" stroke-width="7" stroke-linecap="round"/>
  <line x1="50" y1="14" x2="50" y2="80" stroke="#0F5FAE" stroke-width="7" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="50" y2="80" stroke="url(#viLineGradR)" stroke-width="7" stroke-linecap="round"/>

  <!-- source nodes -->
  <circle cx="20" cy="20" r="8" fill="#0F5FAE"/>
  <circle cx="50" cy="14" r="8" fill="#0A3D70"/>
  <circle cx="80" cy="20" r="8" fill="#0F5FAE"/>

  <!-- match node (accent) -->
  <circle cx="50" cy="82" r="11" fill="#17A673"/>
</svg>
