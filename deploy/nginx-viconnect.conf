# Nginx reverse proxy cho VI CONNECT — viconnect.manai.vn
#
# Cài đặt:
#   sudo cp deploy/nginx-viconnect.conf /etc/nginx/sites-available/viconnect.manai.vn
#   sudo ln -s /etc/nginx/sites-available/viconnect.manai.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d viconnect.manai.vn   # tự thêm block HTTPS bên dưới

server {
    listen 80;
    listen [::]:80;
    server_name viconnect.manai.vn;

    # Giới hạn kích thước body (form upload hồ sơ, tài liệu...)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Next.js cần các header gốc để NextAuth và App Router hoạt động đúng
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ kết nối giữ lâu / streaming của Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
